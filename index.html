<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MrTriplesec Store</title>

  <!-- Stripe -->
  <script src="https://js.stripe.com/v3/"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

  <style>
    body { font-family: Arial; margin: 0; background: #0f0f0f; color: white; }
    header { background: black; padding: 15px; text-align: center; font-size: 24px; }
    nav { display: flex; justify-content: center; gap: 20px; padding: 10px; }
    nav a { color: white; text-decoration: none; }
    .hero { text-align: center; padding: 60px; background: #111; }
    .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 20px; padding: 20px; }
    .card { background: #1a1a1a; padding: 15px; border-radius: 10px; }
    .card img { width: 100%; border-radius: 10px; }
    button { background: red; color: white; border: none; padding: 10px; cursor: pointer; }
    .cart { position: fixed; right: 0; top: 0; width: 300px; background: black; height: 100%; padding: 20px; overflow-y: auto; }
    footer { text-align: center; padding: 20px; background: black; }
  </style>
</head>
<body>

<header>MrTriplesec Store</header>

<nav>
  <a href="#">Home</a>
  <a href="#products">Products</a>
</nav>

<section class="hero">
  <h1>Stay Toxic. Build Wealth.</h1>
  <p>Real products. Real money. Real hustle.</p>
</section>

<section id="products" class="products">
  <div class="card">
    <img src="https://via.placeholder.com/200">
    <h3>Toxic Hoodie</h3>
    <p>$25</p>
    <button onclick="addToCart('Toxic Hoodie',25)">Add to Cart</button>
  </div>
  <div class="card">
    <img src="https://via.placeholder.com/200">
    <h3>Motivation Mug</h3>
    <p>$10</p>
    <button onclick="addToCart('Motivation Mug',10)">Add to Cart</button>
  </div>
</section>

<div class="cart" id="cart">
  <h2>Cart</h2>
  <ul id="cartItems"></ul>
  <p>Total: $<span id="total">0</span></p>
  <button onclick="checkout()">Checkout</button>
</div>

<footer>
  <p>© 2026 MrTriplesec</p>
</footer>

<script>
// ================= CART SYSTEM =================
let cart = [];

function addToCart(name, price) {
  cart.push({name, price});
  displayCart();
}

function displayCart() {
  const cartItems = document.getElementById('cartItems');
  const total = document.getElementById('total');
  cartItems.innerHTML = '';
  let sum = 0;

  cart.forEach(item => {
    const li = document.createElement('li');
    li.textContent = item.name + ' - $' + item.price;
    cartItems.appendChild(li);
    sum += item.price;
  });

  total.textContent = sum;
}

// ================= FIREBASE (SAVE ORDERS) =================
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
};

const app = firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ================= STRIPE PAYMENT =================
const stripe = Stripe("YOUR_STRIPE_PUBLIC_KEY");

async function checkout() {
  if(cart.length === 0){
    alert("Cart is empty");
    return;
  }

  // Save order to Firebase
  await db.collection("orders").add({
    items: cart,
    total: cart.reduce((a,b)=>a+b.price,0),
    created: new Date()
  });

  // Redirect to Stripe (demo)
  alert("Payment integration ready. Connect backend for real payments.");
}
</script>

</body>
</html>
